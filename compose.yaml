name: loopy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopy}
      POSTGRES_USER: ${POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopy_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopy}
      POSTGRES_USER: ${POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopy_local_only}
      DB_HOST: db
      DATABASE_SSLMODE: disable
      HTTP_ADDR: :8080
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3.8-27b}"
      GROQ_RESPONSE_MODE: "${GROQ_RESPONSE_MODE:-json_schema}"
      AUTH_EMAIL_VERIFICATION_REQUIRED: "${AUTH_EMAIL_VERIFICATION_REQUIRED:-true}"
      AUTH_OTP_HMAC_KEY: "${AUTH_OTP_HMAC_KEY:-}"
      AUTH_SMTP_HOST: "${AUTH_SMTP_HOST:-}"
      AUTH_SMTP_PORT: "${AUTH_SMTP_PORT:-}"
      AUTH_SMTP_TLS_MODE: "${AUTH_SMTP_TLS_MODE:-starttls}"
      AUTH_SMTP_USER: "${AUTH_SMTP_USER:-}"
      AUTH_SMTP_PASSWORD: "${AUTH_SMTP_PASSWORD:-}"
      AUTH_SMTP_FROM: "${AUTH_SMTP_FROM:-}"
    depends_on:
      db:
        condition: service_healthy
  android-dev:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/android
    volumes:
      - .:/workspace
      - android-gradle-cache:/root/.gradle
    environment:
      LOOPY_API_BASE_URL: ${LOOPY_API_BASE_URL:-http://10.0.2.2:8080/}
    # SDK host di local.properties tidak dipakai; batasi override ke proses container.
    entrypoint: ["sh", "/workspace/scripts/android-container.sh"]
    command: ["assembleDebug"]
volumes:
  postgres-data:
  android-gradle-cache:
