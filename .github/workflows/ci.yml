name: Verify template
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python3 scripts/check-scaffold.py
      - run: sh ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: loopy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
  ktor-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew --no-daemon test installDist
        working-directory: backend
      - run: docker compose config --quiet
      - run: docker compose -f compose.lxc.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci_config_only
  go-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loopy_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: loopy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopy_test -d loopy_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend/go
    env:
      TEST_DATABASE_URL: postgres://loopy_test:ci_test_only@localhost:5432/loopy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
