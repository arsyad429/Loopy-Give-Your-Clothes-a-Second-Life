name: loopy-vision
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${VISION_POSTGRES_DB:-loopy}
      POSTGRES_USER: ${VISION_POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${VISION_POSTGRES_PASSWORD:-loopy_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
    ports:
      - "127.0.0.1:${VISION_API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${VISION_POSTGRES_DB:-loopy}
      DATABASE_USER: ${VISION_POSTGRES_USER:-loopy}
      DATABASE_PASSWORD: ${VISION_POSTGRES_PASSWORD:-loopy_local_only}
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3.8-27b}"
      GROQ_RESPONSE_MODE: "${GROQ_RESPONSE_MODE:-json_schema}"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
