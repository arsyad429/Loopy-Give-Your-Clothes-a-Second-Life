# Standalone server deployment: docker compose -f compose.lxc.yaml up --build -d --wait
name: loopy
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopy}
      POSTGRES_USER: ${POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopy}
      POSTGRES_USER: ${POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: db
      DATABASE_SSLMODE: disable
      HTTP_ADDR: :8080
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3.8-27b}"
      GROQ_RESPONSE_MODE: "${GROQ_RESPONSE_MODE:-json_schema}"
      AUTH_EMAIL_VERIFICATION_REQUIRED: "${AUTH_EMAIL_VERIFICATION_REQUIRED:-true}"
      AUTH_OTP_HMAC_KEY: "${AUTH_OTP_HMAC_KEY:-}"
      AUTH_SMTP_HOST: "${AUTH_SMTP_HOST:-}"
      AUTH_SMTP_PORT: "${AUTH_SMTP_PORT:-}"
      AUTH_SMTP_TLS_MODE: "${AUTH_SMTP_TLS_MODE:-starttls}"
      AUTH_SMTP_USER: "${AUTH_SMTP_USER:-}"
      AUTH_SMTP_PASSWORD: "${AUTH_SMTP_PASSWORD:-}"
      AUTH_SMTP_FROM: "${AUTH_SMTP_FROM:-}"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres-data:
